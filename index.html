<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantom Log</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
  <div id="app">

    <header class="top">
      <!-- 둥둥 떠다니는 팬텀 로고 SVG -->
      <a href="#" class="header-logo" title="팬텀 노트">
        <svg fill="currentColor" viewBox="45 45 110 90">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M89.1138 112.613C83.1715 121.719 73.2139 133.243 59.9641 133.243C53.7005 133.243 47.6777 130.665 47.6775 119.464C47.677 90.9369 86.6235 46.777 122.76 46.7764C143.317 46.776 151.509 61.0389 151.509 77.2361C151.509 98.0264 138.018 121.799 124.608 121.799C120.352 121.799 118.264 119.462 118.264 115.756C118.264 114.789 118.424 113.741 118.746 112.613C114.168 120.429 105.335 127.683 97.0638 127.683C91.0411 127.683 87.9898 123.895 87.9897 118.576C87.9897 116.642 88.3912 114.628 89.1138 112.613ZM115.936 68.7103C112.665 68.7161 110.435 71.4952 110.442 75.4598C110.449 79.4244 112.689 82.275 115.96 82.2693C119.152 82.2636 121.381 79.4052 121.374 75.4405C121.367 71.4759 119.128 68.7047 115.936 68.7103ZM133.287 68.6914C130.016 68.6972 127.786 71.4763 127.793 75.4409C127.8 79.4055 130.039 82.2561 133.311 82.2504C136.503 82.2448 138.732 79.3863 138.725 75.4216C138.718 71.457 136.479 68.6858 133.287 68.6914Z">
          </path>
        </svg>
      </a>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="today" id="todayLabel"></div>
        <button class="theme-toggle-btn" id="themeToggle" title="테마 전환">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M11.3805 2.01977C9.91572 3.38768 9 5.33708 9 7.5C9 11.6421 12.3579 15 16.5 15C18.6629 15 20.6123 14.0843 21.9802 12.6195C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33871 11.3805 2.01977Z" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button data-view="cal" class="active">캘린더</button>
      <button data-view="feed">피드</button>
      <button data-view="goals">목표 &amp; 회고</button>
    </nav>

    <main>
      <!-- ================= CALENDAR ================= -->
      <section class="view active" id="view-cal">
        <div class="subtabs">
          <button class="subtab active" data-sub="grid">달력</button>
          <button class="subtab" data-sub="today">오늘 할 일</button>
        </div>

        <div class="sub-view active" id="sub-grid">
          <div class="cal-head">
            <button class="nav-btn" id="prevMonth">‹</button>
            <h2 id="calTitle"></h2>
            <button class="nav-btn" id="nextMonth">›</button>
          </div>
          <div class="weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="grid" id="calGrid"></div>

          <div class="day-panel" id="dayPanel" style="display:none;">
            <div class="dp-head">
              <span id="dpDate">-</span>
            </div>
            <div class="choice-row">
              <button class="choice-btn todo" id="btnGoTodo">할 일 만들기</button>
            </div>
            <div id="dpEntries"></div>
          </div>
        </div>

        <div class="sub-view" id="sub-today">
          <div class="cal-head" style="margin-bottom:14px;">
            <h2 id="todayTabTitle">오늘 할 일</h2>
            <button class="nav-btn" id="quickAddTodoBtn" title="오늘 할 일 추가">＋</button>
          </div>
          <div id="todayTodoList"></div>
        </div>
      </section>

      <!-- ================= FEED ================= -->
      <section class="view" id="view-feed">
        <div class="compose">
          <textarea id="composeText" placeholder="무슨 생각을 하고 있나요?"></textarea>
          <div class="image-preview-wrap" id="imagePreviewWrap" style="display:none;">
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>
          <div class="foot">
            <div class="foot-row">
              <input type="date" id="composeDate">
              <select id="composeCategory"></select>
              <label for="composeImageInput" class="img-upload-btn" title="사진 첨부">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
              </label>
              <input type="file" id="composeImageInput" accept="image/*" multiple style="display:none;">
            </div>
            <div class="foot-row">
              <span class="char" id="charCount">0</span>
              <button class="post-btn" id="postBtn">게시</button>
            </div>
          </div>
        </div>

        <div class="search-row">
          <div class="search-box">
            <span class="icon">⌕</span>
            <input type="text" id="searchInput" placeholder="내가 쓴 글 검색...">
          </div>
          <div class="search-date-wrap">
            <input type="date" id="searchDateInput" title="날짜별 글 검색">
            <button type="button" id="clearSearchDateBtn" class="clear-date-btn" title="날짜 필터 초기화" style="display:none;">✕</button>
          </div>
        </div>

        <div class="cat-chips" id="catChips"></div>
        <button id="manageCatsBtn" class="manage-btn">카테고리 관리</button>

        <div id="feedList"></div>
      </section>

      <!-- ================= GOALS ================= -->
      <section class="view" id="view-goals">
        <div class="month-select">
          <button class="nav-btn" id="prevMonthG">‹</button>
          <h2 id="goalsTitle"></h2>
          <button class="nav-btn" id="nextMonthG">›</button>
        </div>

        <div class="card">
          <h3>이번 달 목표</h3>
          <div id="goalsList"></div>
          <div class="add-goal">
            <input type="text" id="newGoalInput" placeholder="새 목표 입력...">
            <button id="addGoalBtn">추가</button>
          </div>
        </div>

        <div class="card">
          <h3>이번 달 회고</h3>
          <textarea class="retro" id="retroText" placeholder="이번 달은 어땠나요? 잘한 점, 아쉬운 점을 적어보세요."></textarea>
          <div class="save-hint" id="retroSaved">자동 저장됨</div>
        </div>
      </section>
    </main>

    <footer class="util">
      <button id="exportBtn">백업하기 (.zip)</button>
      <button id="importBtn">불러오기</button>
      <button id="notifBtn">알림 켜기</button>
    </footer>
    <input type="file" id="importFile" accept="application/json, .zip">
    <div id="storageNotice" class="storage-notice"></div>
  </div>

  <!-- ================= MODALS ================= -->
  <!-- Todo modal -->
  <div class="overlay" id="todoOverlay">
    <div class="modal">
      <h3>할 일 만들기</h3>
      <div class="field">
        <label>내용</label>
        <input type="text" id="todoContent" placeholder="예: 병원 예약 확인하기">
      </div>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="todoDate">
      </div>
      <div class="field">
        <label>시간 (알림)</label>
        <input type="time" id="todoTime">
      </div>
      <div class="btn-row">
        <button class="btn-cancel" id="todoCancel">취소</button>
        <button class="btn-save" id="todoSave">저장</button>
      </div>
    </div>
  </div>

  <!-- Category manage modal -->
  <div class="overlay" id="catOverlay">
    <div class="modal">
      <h3>카테고리 관리</h3>
      <div id="catManageList" style="margin-bottom:14px;"></div>
      <div class="add-goal">
        <input type="text" id="newCatInput" placeholder="새 카테고리 이름">
        <button id="addCatBtn">추가</button>
      </div>
      <div class="btn-row">
        <button class="btn-cancel" id="catClose">닫기</button>
      </div>
    </div>
  </div>

  <!-- Image Lightbox modal -->
  <div class="overlay image-modal-overlay" id="imgModalOverlay">
    <div class="image-modal-content">
      <button type="button" class="image-modal-close" id="imgModalClose" title="닫기">✕</button>
      <img id="imgModalImg" src="" alt="확대 이미지">
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/modules/utils.js"></script>
  <script src="js/modules/storage.js"></script>
  <script src="js/modules/theme.js"></script>
  <script src="js/modules/navigation.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/feed.js"></script>
  <script src="js/modules/goals.js"></script>
  <script src="js/modules/backup.js"></script>
  <script src="js/modules/notification.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
